server {
    listen 80;
    root /usr/share/nginx/html;

    # Vite hashes everything under assets/ (v86.wasm included), so it can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The guest's files are named by their content hash.
    location /v86/rootfs/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # fs.json, the snapshot and index.html have to match each other, so always revalidate them.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
}
