# On a version tag: build once, play it, publish that build's source as a release, then deploy the same files.
# Package versions float between builds, so the source only matches when it comes from this run.
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        run: docker build --target site --output type=local,dest=site .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Play every level
        run: npm ci && npm test -- --site site
      - name: Collect the source
        run: |
          mkdir -p public/v86
          cp site/v86/third-party.txt public/v86/
          image/sources.sh
          grep -q . sources/tilde-sources.tar.sha256
      - name: Publish the source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" sources/tilde-sources.tar sources/tilde-sources.tar.sha256 --generate-notes
      - name: Link the notices to this release
        run: sed -i "s#tilde/releases\$#tilde/releases/tag/$GITHUB_REF_NAME#" site/v86/third-party.txt
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy site --project-name tilde --branch main
